Startup_0=Git Credential Manager Detected
Startup_1=Git Credential Manager (GCM) has been detected on your system.\n\nGCM can handle HTTPS authentication automatically using browser-based login, OAuth, and SSO. It caches credentials securely in your operating system's credential store.\n\nWould you like to use GCM for HTTPS repository authentication?\n\n(You can change this later in Preferences > Collaboration > Authentication > HTTP)
